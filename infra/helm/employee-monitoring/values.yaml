# Default values for employee-monitoring
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  api:
    repository: employeemonitoring/api
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  dashboard:
    repository: employeemonitoring/dashboard
    pullPolicy: IfNotPresent
    tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  api:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  dashboard:
    type: ClusterIP
    port: 80
    targetPort: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: monitoring.company.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: employee-monitoring-tls
      hosts:
        - monitoring.company.com

resources:
  api:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  dashboard:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Application configuration
config:
  # Database (managed externally or via Cloud SQL)
  database:
    host: ""
    port: 5432
    name: employeemonitoring
    username: ""
    password: ""
    sslMode: require

  auditDatabase:
    host: ""
    port: 5432
    name: employeemonitoring_audit
    username: ""
    password: ""
    sslMode: require

  # Redis for caching and SignalR backplane
  redis:
    host: ""
    port: 6379
    password: ""
    ssl: false

  # JWT
  jwt:
    issuer: "EmployeeMonitoring.Api"
    audience: "EmployeeMonitoring.Client"
    signingKey: ""
    expiryMinutes: 60

  # OIDC
  oidc:
    authority: ""
    clientId: ""
    clientSecret: ""
    callbackPath: "/signin-oidc"
    scopes:
      - openid
      - profile
      - email
      - offline_access

  # Retention
  retention:
    screenshotsDays: 30
    activityDays: 90
    dlpEventsDays: 365
    auditLogsDays: 2555

  # Notifications
  notifications:
    email:
      smtpHost: ""
      smtpPort: 587
      username: ""
      password: ""
      fromAddress: ""
    teams:
      webhookUrl: ""
    slack:
      webhookUrl: ""

  # Features
  features:
    enableRealTimeUpdates: true
    enableScreenshotBlur: true
    enablePauseNotifications: true
    enableDlpMonitoring: true

# Monitoring
monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
  grafana:
    enabled: true
    dashboards:
      enabled: true

# Backup
backup:
  enabled: true
  schedule: "0 2 * * *"
  retentionDays: 30
  storage:
    type: s3
    bucket: ""
    region: ""
    accessKey: ""
    secretKey: ""

# Agent configuration (pushed to agents)
agent:
  defaultScreenshotIntervalSeconds: 600
  defaultActivityIntervalSeconds: 60
  heartbeatTimeoutSeconds: 120
  maxBatchSize: 100

# Node selector and tolerations
nodeSelector: {}
tolerations: []
affinity: {}